<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PKMX — 本地优先笔记</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14' fill='%232B4C7E'/%3E%3Cpath d='M16 8c3 4.2 5 6.8 5 9.4a5 5 0 1 1-10 0C11 14.8 13 12.2 16 8z' fill='%23FBFBF9'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@600;700;900&family=Noto+Sans+SC:wght@400;500;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* ============ 设计令牌 ============ */
:root{
  --chrome:#ECEDE9; --panel:#F5F5F2; --paper:#FBFBF9; --card:#FFFFFF;
  --ink:#1E2530; --ink-2:#4A5160; --ink-3:#8A8F9C;
  --hair:#E1E2DC; --hair-2:#EBEBE6;
  --accent:#2B4C7E; --accent-2:#1F3A61;
  --accent-soft:rgba(43,76,126,.08); --sel:rgba(43,76,126,.14);
  --wikilink:#35618F;
  --st-todo:#8A8F9C; --st-doing:#2B4C7E; --st-blocked:#BE4B31; --st-done:#4A7C59; --st-wont:#A9AAB2;
  --t-task:#BE4B31; --t-daily:#7A557E;
  --ok:#4A7C59; --warn:#A8763E; --over:#B3372A;
  --shadow-1:0 1px 2px rgba(30,37,48,.05),0 2px 8px rgba(30,37,48,.06);
  --shadow-2:0 4px 14px rgba(30,37,48,.10),0 2px 5px rgba(30,37,48,.08);
  --shadow-3:0 12px 34px rgba(30,37,48,.16),0 4px 10px rgba(30,37,48,.10);
  --r-s:5px; --r-m:8px; --r-l:12px;
  --f-ui:"Noto Sans SC","Microsoft YaHei UI","Microsoft YaHei",sans-serif;
  --f-dis:"Noto Serif SC","Source Han Serif SC","STSong","SimSun",serif;
  --f-mono:"JetBrains Mono","Cascadia Code",Consolas,monospace;
  --tr:cubic-bezier(.3,.7,.4,1);
}
html[data-theme="dark"]{
  --chrome:#15171B; --panel:#1A1D22; --paper:#1F2228; --card:#23262D;
  --ink:#E8E6DF; --ink-2:#B4B7BE; --ink-3:#7C8089;
  --hair:#2C2F36; --hair-2:#26292F;
  --accent:#7FA3D4; --accent-2:#9BBBDD; --accent-soft:rgba(127,163,212,.10); --sel:rgba(127,163,212,.18);
  --wikilink:#8FB3DE;
  --st-todo:#8A8F9C; --st-doing:#7FA3D4; --st-blocked:#D97B62; --st-done:#7FAB8C; --st-wont:#7A7B83;
  --t-task:#D97B62; --t-daily:#A983AD;
  --shadow-1:0 1px 2px rgba(0,0,0,.3),0 2px 8px rgba(0,0,0,.25);
  --shadow-2:0 4px 14px rgba(0,0,0,.38),0 2px 5px rgba(0,0,0,.3);
  --shadow-3:0 12px 34px rgba(0,0,0,.5),0 4px 10px rgba(0,0,0,.35);
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{font-family:var(--f-ui);font-size:14px;color:var(--ink);background:var(--chrome);overflow:hidden;-webkit-font-smoothing:antialiased}
::selection{background:var(--sel)}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-thumb{background:var(--hair);border-radius:9px;border:2px solid transparent;background-clip:content-box}
::-webkit-scrollbar-thumb:hover{background:var(--ink-3);border:2px solid transparent;background-clip:content-box}
::-webkit-scrollbar-track{background:transparent}
button{font-family:inherit;font-size:inherit;color:inherit;background:none;border:none;cursor:pointer}
input,textarea,select{font-family:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:1px;border-radius:3px}

/* ============ 应用骨架 ============ */
.app{display:grid;grid-template-rows:44px 1fr 27px;height:100vh}
.mid{display:flex;min-height:0}

/* ============ 标题栏 ============ */
.titlebar{display:flex;align-items:center;gap:10px;padding:0 10px 0 14px;background:var(--chrome);border-bottom:1px solid var(--hair);user-select:none}
.brand{display:flex;align-items:center;gap:8px;font-family:var(--f-dis);font-weight:700;font-size:15px;letter-spacing:.5px}
.brand .en{font-family:var(--f-mono);font-size:10.5px;font-weight:400;color:var(--ink-3);letter-spacing:1px;margin-top:2px}
.tb-right{margin-left:auto;display:flex;align-items:center;gap:4px}
.icon-btn{display:grid;place-items:center;width:30px;height:30px;border-radius:var(--r-m);color:var(--ink-2);transition:background .14s var(--tr)}
.icon-btn:hover{background:var(--accent-soft);color:var(--ink)}
.icon-btn svg{width:16px;height:16px}
.tb-btn{display:flex;align-items:center;gap:6px;padding:5px 11px;border-radius:var(--r-m);font-size:12.5px;color:var(--ink-2);transition:all .14s var(--tr)}
.tb-btn:hover{background:var(--accent-soft);color:var(--ink)}
.tb-btn kbd{font-family:var(--f-mono);font-size:10px;padding:1px 5px;border:1px solid var(--hair);border-radius:4px;background:var(--card);color:var(--ink-3)}
.winctl{display:flex;margin-left:6px}
.winctl button{width:34px;height:30px;display:grid;place-items:center;color:var(--ink-3);border-radius:var(--r-m)}
.winctl button:hover{background:var(--accent-soft);color:var(--ink)}
.winctl .close:hover{background:#C0392B;color:#fff}

/* ============ 侧栏（视图在顶 + 文件树） ============ */
.sidebar{width:248px;flex:none;background:var(--panel);border-right:1px solid var(--hair);display:flex;flex-direction:column;padding:10px 8px 8px;gap:1px;overflow-y:auto}
.nav-sec{margin:10px 6px 5px;font-family:var(--f-mono);font-size:10px;letter-spacing:2px;color:var(--ink-3);display:flex;align-items:center;justify-content:space-between}
.nav-sec .add{width:19px;height:19px;display:grid;place-items:center;border-radius:4px;color:var(--ink-3)}
.nav-sec .add:hover{background:var(--accent-soft);color:var(--accent)}
.nav-item{display:flex;align-items:center;gap:9px;width:100%;padding:6px 10px;border-radius:var(--r-m);font-size:13px;color:var(--ink-2);transition:all .12s var(--tr);position:relative}
.nav-item:hover{background:var(--accent-soft);color:var(--ink)}
.nav-item.active{background:var(--sel);color:var(--ink);font-weight:500}
.nav-item.active::before{content:"";position:absolute;left:-8px;top:50%;transform:translateY(-50%);width:3px;height:16px;border-radius:3px;background:var(--accent)}
.nav-item .ico{width:15px;height:15px;flex:none;display:grid;place-items:center;color:var(--ink-3)}
.nav-item .ico svg{width:15px;height:15px}
.nav-item .cnt{margin-left:auto;font-family:var(--f-mono);font-size:10.5px;color:var(--ink-3)}
.nav-item .cnt.hot{color:var(--st-blocked);font-weight:600}
.side-div{border-top:1px solid var(--hair-2);margin:12px 6px 0}
/* 文件树 */
.tree{display:flex;flex-direction:column;gap:1px}
.tree-row{display:flex;align-items:center;gap:7px;width:100%;padding:5px 8px;border-radius:var(--r-m);font-size:13px;color:var(--ink-2);transition:all .11s var(--tr);position:relative;text-align:left}
.tree-row:hover{background:var(--accent-soft);color:var(--ink)}
.tree-row.active{background:var(--sel);color:var(--ink);font-weight:500}
.tree-row.active::before{content:"";position:absolute;left:-8px;top:50%;transform:translateY(-50%);width:3px;height:15px;border-radius:3px;background:var(--accent)}
.tree-row .chev{width:12px;height:12px;flex:none;color:var(--ink-3);transition:transform .13s var(--tr);display:grid;place-items:center}
.tree-row .chev svg{width:10px;height:10px}
.tree-row.open .chev{transform:rotate(90deg)}
.tree-row .fi{width:14px;height:14px;flex:none;color:var(--ink-3);display:grid;place-items:center}
.tree-row .fi svg{width:14px;height:14px}
.tree-row .nm{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tree-row .mini{font-family:var(--f-mono);font-size:9px;flex:none;width:7px;height:7px;border-radius:50%}
.tree-kids{display:flex;flex-direction:column;gap:1px;padding-left:15px}
.sidebar-foot{margin-top:auto;padding-top:8px;border-top:1px solid var(--hair-2);display:flex;flex-direction:column;gap:1px}

/* chips */
.chip{display:inline-flex;align-items:center;gap:4px;padding:1px 7px;border-radius:99px;font-family:var(--f-mono);font-size:10px;line-height:17px;border:1px solid var(--hair);color:var(--ink-2);background:var(--card);white-space:nowrap}
.chip .cdot{width:6px;height:6px;border-radius:50%}
.chip.st-todo{color:var(--st-todo);border-color:color-mix(in srgb,var(--st-todo) 35%,transparent)}
.chip.st-doing{color:var(--st-doing);border-color:color-mix(in srgb,var(--st-doing) 35%,transparent)}
.chip.st-blocked{color:var(--st-blocked);border-color:color-mix(in srgb,var(--st-blocked) 40%,transparent)}
.chip.st-done{color:var(--st-done);border-color:color-mix(in srgb,var(--st-done) 35%,transparent)}
.chip.st-wont{color:var(--st-wont)}
.chip.due{color:var(--warn)} .chip.due.today{color:var(--st-blocked);border-color:color-mix(in srgb,var(--st-blocked) 45%,transparent);font-weight:600}
.chip.due.over{color:var(--over);border-color:color-mix(in srgb,var(--over) 45%,transparent);font-weight:600}
.chip.pr-Urgent{color:var(--st-blocked);font-weight:600} .chip.pr-High{color:var(--warn)} .chip.pr-Normal{color:var(--ink-2)} .chip.pr-Low{color:var(--ink-3)}

/* ============ 编辑器区 ============ */
.editor-wrap{flex:1;display:flex;min-width:0;min-height:0;background:var(--paper)}
.editor{flex:1;display:flex;flex-direction:column;min-width:0}
.ed-bar{display:flex;align-items:center;gap:4px;padding:8px 14px;border-bottom:1px solid var(--hair-2)}
.crumb{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--ink-3);min-width:0;margin-right:6px}
.crumb .f{font-family:var(--f-mono);font-size:11px;color:var(--ink-2);background:var(--panel);padding:2px 7px;border-radius:5px;border:1px solid var(--hair-2);white-space:nowrap}
.crumb .f:hover{border-color:var(--accent);color:var(--accent)}
.crumb .sep{opacity:.5}
.ed-tools{margin-left:auto;display:flex;gap:2px}
.tool{display:flex;align-items:center;gap:5px;padding:5px 9px;border-radius:var(--r-m);font-size:12px;color:var(--ink-3);transition:all .12s var(--tr)}
.tool:hover{background:var(--accent-soft);color:var(--ink)}
.tool.on{background:var(--sel);color:var(--ink)}
.tool kbd{font-family:var(--f-mono);font-size:9.5px;border:1px solid var(--hair);border-radius:3px;padding:0 4px;color:var(--ink-3)}
.tool svg{width:14px;height:14px}
.ed-scroll{flex:1;overflow-y:auto;scroll-behavior:smooth}
.ed-page{max-width:720px;margin:0 auto;padding:26px 44px 120px}
.ed-page.wide{max-width:980px}

/* 属性条 */
.props{display:flex;align-items:center;flex-wrap:wrap;gap:6px;padding:8px 12px;margin-bottom:22px;border:1px dashed var(--hair);border-radius:var(--r-l);background:color-mix(in srgb,var(--panel) 55%,transparent)}
.props.hidden{display:none}
.prop{display:inline-flex;align-items:center;gap:6px;font-family:var(--f-mono);font-size:11px;color:var(--ink-2);padding:3px 4px 3px 8px;border-radius:6px;transition:background .12s var(--tr)}
.prop:hover{background:var(--accent-soft)}
.prop .k{color:var(--ink-3)}
.prop .v{color:var(--ink);display:inline-flex;align-items:center;gap:5px}
.prop .caret{width:9px;height:9px;opacity:.5}
.prop-add{font-family:var(--f-mono);font-size:11px;color:var(--ink-3);padding:3px 8px;border-radius:6px}
.prop-add:hover{background:var(--accent-soft);color:var(--accent)}

/* 正文排版 */
.doc h1{font-family:var(--f-dis);font-size:29px;font-weight:700;line-height:1.3;margin:0 0 6px;letter-spacing:.3px}
.doc .subtitle{font-family:var(--f-mono);font-size:11px;color:var(--ink-3);margin-bottom:26px;display:flex;gap:12px;flex-wrap:wrap}
.doc h2{font-family:var(--f-dis);font-size:19px;font-weight:700;margin:34px 0 10px;padding-top:14px;border-top:1px solid var(--hair-2)}
.doc h3{font-size:15px;font-weight:700;margin:22px 0 8px}
.doc p{font-size:14.5px;line-height:1.85;color:var(--ink);margin:10px 0}
.doc ul,.doc ol{padding-left:4px;list-style:none;margin:8px 0}
.doc li{font-size:14.5px;line-height:1.85;padding-left:22px;position:relative;margin:3px 0}
.doc ul>li::before{content:"";position:absolute;left:6px;top:.82em;width:5px;height:5px;border-radius:50% 50% 50% 2px;transform:rotate(45deg);background:var(--ink-3)}
.doc ol{counter-reset:oli}
.doc ol>li{counter-increment:oli;padding-left:30px}
.doc ol>li::before{content:counter(oli,decimal-leading-zero);position:absolute;left:0;top:.28em;font-family:var(--f-mono);font-size:11px;color:var(--accent)}
.doc blockquote{margin:14px 0;padding:10px 16px;border-left:3px solid var(--accent);background:var(--accent-soft);border-radius:0 var(--r-m) var(--r-m) 0}
.doc blockquote p{margin:2px 0;font-size:13.5px;color:var(--ink-2)}
.doc pre{font-family:var(--f-mono);font-size:12.5px;line-height:1.7;background:var(--card);border:1px solid var(--hair);border-radius:var(--r-m);padding:13px 16px;overflow-x:auto;margin:14px 0;color:var(--ink-2)}
.doc code{font-family:var(--f-mono);font-size:.86em;background:var(--panel);border:1px solid var(--hair-2);padding:1px 5px;border-radius:4px}
.doc pre code{background:none;border:none;padding:0}
.doc hr{border:none;border-top:1px solid var(--hair);margin:26px 0}
.doc strong{font-weight:700}
.wl{color:var(--wikilink);cursor:pointer;border-bottom:1px solid color-mix(in srgb,var(--wikilink) 30%,transparent);transition:all .12s var(--tr)}
.wl:hover{border-bottom:1px solid var(--wikilink);background:var(--accent-soft);border-radius:2px}
.wl.unres{color:var(--over);border-bottom:1px dashed var(--over)}
/* 任务 */
.task{display:flex;gap:10px;align-items:flex-start;padding:2px 0}
.task input{appearance:none;width:16px;height:16px;flex:none;margin-top:6px;border:1.5px solid var(--ink-3);border-radius:4px;cursor:pointer;position:relative;transition:all .13s var(--tr)}
.task input:hover{border-color:var(--accent)}
.task input:checked{background:var(--accent);border-color:var(--accent)}
.task input:checked::after{content:"";position:absolute;left:4.5px;top:1.5px;width:4px;height:8px;border:solid #F4F6FA;border-width:0 2px 2px 0;transform:rotate(42deg)}
html[data-theme="dark"] .task input:checked::after{border-color:#10141B}
.task input:checked + .tl{text-decoration:line-through;text-decoration-color:var(--ink-3);color:var(--ink-3)}
.task .tl{font-size:14.5px;line-height:1.75}
.task .meta{font-family:var(--f-mono);font-size:10px;color:var(--warn);margin-left:6px}

/* 注入区块（Daily 自动聚合） */
.inject{margin:6px 0 22px;border:1px dashed color-mix(in srgb,var(--t-daily) 45%,transparent);border-radius:var(--r-l);overflow:hidden}
.inject-head{display:flex;align-items:center;gap:8px;padding:8px 14px;background:color-mix(in srgb,var(--t-daily) 7%,transparent)}
.inject-head h4{font-size:12.5px;font-weight:700;color:var(--t-daily);letter-spacing:1px}
.inject-head .badge{font-family:var(--f-mono);font-size:9.5px;padding:1px 6px;border-radius:99px;border:1px solid color-mix(in srgb,var(--t-daily) 40%,transparent);color:var(--t-daily)}
.inject-head .refresh{margin-left:auto;color:var(--t-daily);opacity:.65;display:grid;place-items:center;width:20px;height:20px;border-radius:5px}
.inject-head .refresh:hover{opacity:1;background:color-mix(in srgb,var(--t-daily) 12%,transparent)}
.inject-head .refresh svg{width:12px;height:12px}
.inject-body{padding:6px 10px 10px}
.inj-row{display:flex;align-items:center;gap:9px;width:100%;text-align:left;padding:7px 8px;border-radius:var(--r-m);transition:background .12s var(--tr)}
.inj-row:hover{background:var(--accent-soft)}
.inj-row .t{font-size:13.5px;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.inj-row .sdot{width:7px;height:7px;border-radius:50%;flex:none}
.inj-row .none{font-size:12.5px;color:var(--ink-3);padding:8px 8px}

/* 源码模式 */
.src-wrap{flex:1;display:flex;flex-direction:column;min-height:0}
.src-meta{padding:8px 18px;font-family:var(--f-mono);font-size:10.5px;color:var(--ink-3);border-bottom:1px solid var(--hair-2);display:flex;gap:14px}
.src-wrap textarea{flex:1;resize:none;border:none;outline:none;background:transparent;font-family:var(--f-mono);font-size:13px;line-height:1.8;padding:20px 44px;color:var(--ink);white-space:pre;overflow:auto}
.src-wrap textarea::placeholder{color:var(--ink-3)}

/* 右栏 */
.rail-right{width:264px;flex:none;border-left:1px solid var(--hair);background:var(--panel);overflow-y:auto;padding:14px 12px}
.rr-sec{margin-bottom:20px}
.rr-sec h5{font-family:var(--f-mono);font-size:10px;letter-spacing:2px;color:var(--ink-3);margin:0 4px 8px}
.toc-item{display:block;width:100%;text-align:left;padding:4px 10px;border-radius:6px;font-size:12.5px;color:var(--ink-2);border-left:2px solid transparent;transition:all .12s var(--tr);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.toc-item:hover{background:var(--accent-soft);color:var(--ink)}
.toc-item.h2{padding-left:10px} .toc-item.h3{padding-left:24px;font-size:12px;color:var(--ink-3)}
.bl-card{display:block;width:100%;text-align:left;padding:8px 10px;border-radius:var(--r-m);border:1px solid var(--hair-2);background:var(--card);margin-bottom:6px;transition:all .12s var(--tr)}
.bl-card:hover{border-color:var(--accent)}
.bl-card .bt{display:flex;align-items:center;gap:6px;font-size:12.5px;font-weight:500;margin-bottom:3px}
.bl-card .bs{font-size:11.5px;color:var(--ink-3);line-height:1.6;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.rr-empty{font-size:12px;color:var(--ink-3);padding:4px 8px}

/* ============ 看板 ============ */
.view-kanban{flex:1;display:flex;flex-direction:column;min-width:0;background:var(--paper)}
.kb-head{display:flex;align-items:center;gap:10px;padding:16px 22px 12px}
.kb-head h2{font-family:var(--f-dis);font-size:19px;font-weight:700}
.kb-head .hint{font-family:var(--f-mono);font-size:10.5px;color:var(--ink-3);margin-left:auto}
.kb-board{flex:1;display:flex;gap:12px;padding:4px 22px 18px;overflow-x:auto;align-items:stretch}
.kb-col{flex:1 1 220px;min-width:206px;width:auto;display:flex;flex-direction:column;border-radius:var(--r-l);background:var(--panel);border:1px solid var(--hair-2);min-height:0;transition:all .15s var(--tr)}
.kb-col.over{border-color:var(--accent);background:var(--accent-soft);box-shadow:0 0 0 1px var(--accent)}
.kb-col-head{display:flex;align-items:center;gap:8px;padding:11px 14px 8px}
.kb-col-head .cdot{width:8px;height:8px;border-radius:50%}
.kb-col-head h3{font-size:13px;font-weight:700}
.kb-col-head .n{font-family:var(--f-mono);font-size:10.5px;color:var(--ink-3)}
.kb-col-head .add{margin-left:auto;width:20px;height:20px;display:grid;place-items:center;border-radius:5px;color:var(--ink-3)}
.kb-col-head .add:hover{background:var(--accent-soft);color:var(--accent)}
.kb-list{flex:1;overflow-y:auto;padding:2px 10px 12px;display:flex;flex-direction:column;gap:8px}
.kb-card{position:relative;background:var(--card);border:1px solid var(--hair);border-radius:var(--r-m);padding:11px 13px 10px;cursor:grab;box-shadow:var(--shadow-1);transition:border-color .14s var(--tr),box-shadow .14s var(--tr),transform .14s var(--tr)}
.kb-card:hover{border-color:color-mix(in srgb,var(--accent) 45%,var(--hair));box-shadow:var(--shadow-2)}
.kb-card.dragging{opacity:.45;transform:rotate(1.6deg)}
.kb-card .kc-title{font-size:13.5px;font-weight:500;line-height:1.5;margin-bottom:8px}
.kb-card .kc-foot{display:flex;align-items:center;gap:5px;flex-wrap:wrap}
.kb-card .kc-foot .fold{margin-left:auto;font-size:11px;color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:96px}

};

/* ---------- 迷你 Markdown 渲染 ---------- */
function inlineMd(s){
  let h = esc(s);
  h = h.replace(/`([^`]+)`/g,'<code>$1</code>');
  h = h.replace(/\[\[([^\]]+)\]\]/g,(m,t)=>{
    const hit = byTitle(t.trim());
    return `<span class="wl${hit?'':' unres'}" data-target="${esc(t.trim())}" title="${hit?hit.file:'未解析 · 点击创建'}">${esc(t.trim())}</span>`;
  });
  h = h.replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>');
  return h;
}
function mdToHtml(body){
  const lines = body.split('\n'); let out=[]; let i=0; let taskIdx=0;
  while(i<lines.length){
    const L = lines[i];
    if(L.startsWith('```')){
      let buf=[]; i++;
      while(i<lines.length && !lines[i].startsWith('```')){ buf.push(lines[i]); i++; }
      i++; out.push(`<pre><code>${esc(buf.join('\n'))}</code></pre>`); continue;
    }
    if(/^> \[!note\]/.test(L)){
      let buf=[]; i++;
      while(i<lines.length && lines[i].startsWith('>')){ buf.push(lines[i].replace(/^> ?/,'')); i++; }
      out.push(`<blockquote><p>${inlineMd(buf.join(' '))}</p></blockquote>`); continue;
    }
    if(/^---+$/.test(L.trim())){ out.push('<hr>'); i++; continue; }
    let m;
    if(m = L.match(/^(#{1,3})\s+(.*)/)){ const lv=m[1].length; out.push(`<h${lv}>${inlineMd(m[2])}</h${lv}>`); i++; continue; }
    if(m = L.match(/^- \[([ x])\]\s+(.*)/)){
      const idx = taskIdx++;
      out.push(`<div class="task"><input type="checkbox" data-task="${idx}" ${m[1]==='x'?'checked':''} aria-label="任务"><span class="tl">${inlineMd(m[2])}</span></div>`);
      i++; continue;
    }
    if(/^- /.test(L)){
      let buf=[]; while(i<lines.length && /^- /.test(lines[i])){ buf.push(lines[i].slice(2)); i++; }
      out.push(`<ul>${buf.map(b=>`<li>${inlineMd(b)}</li>`).join('')}</ul>`); continue;
    }
    if(/^\d+\. /.test(L)){
      let buf=[]; while(i<lines.length && /^\d+\. /.test(lines[i])){ buf.push(lines[i].replace(/^\d+\. /,'')); i++; }
      out.push(`<ol>${buf.map(b=>`<li>${inlineMd(b)}</li>`).join('')}</ol>`); continue;
    }
    if(L.trim()===''){ i++; continue; }
    let buf=[L]; i++;
    while(i<lines.length && lines[i].trim()!=='' && !/^(#|```|- |\d+\. |>)/.test(lines[i])){ buf.push(lines[i]); i++; }
    out.push(`<p>${inlineMd(buf.join(' '))}</p>`);
  }
  return out.join('\n');
}
function toggleTask(note, idx){
  let n=-1; const re=/- \[([ x])\]/g; let m;
  while((m=re.exec(note.body))){ n++; if(n===idx){ break; } }
  if(n!==idx) return;
  note.body = note.body.slice(0,m.index) + '- [' + (m[1]==='x'?' ':'x') + ']' + note.body.slice(m.index+5);
}

/* 文件树（Obsidian 式） */
function renderTree(){
  const el = $('#tree'); if(!el) return;
  const folders = [...new Set(NOTES.map(n=>n.folder).filter(f=>f))].sort();
  let html='';
  for(const f of folders){
    const open = state.openFolders.has(f);
    const kids = NOTES.filter(n=>n.folder===f).sort((a,b)=>a.title.localeCompare(b.title,'zh'));
    html += `<button class="tree-row ${open?'open':''}" data-fold="${esc(f)}">
      <span class="chev">${I.chev}</span><span class="fi">${I.folder}</span><span class="nm">${esc(f)}</span>
      <span class="cnt" style="font-family:var(--f-mono);font-size:10px;color:var(--ink-3)">${kids.length}</span>
    </button>`;
    if(open){
      html += `<div class="tree-kids">${kids.map(n=>`
        <button class="tree-row ${state.noteId===n.id?'active':''}" data-note="${n.id}">
          <span class="chev" style="visibility:hidden">${I.chev}</span><span class="fi">${I.file}</span><span class="nm">${esc(n.title)}</span>

    <button class="tree-row ${state.noteId===n.id?'active':''}" data-note="${n.id}">
      <span class="chev" style="visibility:hidden">${I.chev}</span><span class="fi">${I.file}</span><span class="nm">${esc(n.title)}</span>

    </button>`).join('');
  el.innerHTML = html;
  el.querySelectorAll('[data-fold]').forEach(b=>b.addEventListener('click',()=>{

function currentNote(){ return NOTES.find(n=>n.id===state.noteId); }
function backlinks(note){
  const links=[]; const re=new RegExp('\\[\\['+note.title.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+'\\]\\]','g');
  for(const src of NOTES){ if(src.id===note.id) continue;
    const m = src.body.match(re);
    if(m) links.push({src, count:m.length});
  }
  return links;
}

function gotoTitle(t){

function setStatus(n, s){

              <div class="kb-card" draggable="true" data-note="${n.id}" title="打开《${esc(n.title)}》">
                ${n.status==='Done'?'<span class="seal">讫</span>':''}
                ${n.status==='Wont'?'<span class="seal" style="border-color:var(--st-wont);color:var(--st-wont)">弃</span>':''}
                <div class="kc-title" style="border-left:3px solid ${n.priority==='Urgent'?'var(--st-blocked)':n.priority==='High'?'var(--warn)':'var(--hair)'};padding-left:9px">${esc(n.title)}</div>
                <div class="kc-foot">
                  ${n.priority&&n.priority!=='Normal'?`<span class="chip pr-${n.priority}">${PR_LABEL[n.priority]}</span>`:''}
                  ${n.due?`<span class="chip due ${n.due<TODAY?'over':(n.due===TODAY?'today':'')}">${n.due<TODAY?'逾期 '+n.due.slice(5):(n.due===TODAY?'今天':n.due.slice(5))}</span>`:''}
                  ${n.folder?`<span class="fold">${esc(n.folder)}/</span>`:''}
                </div>
              </div>`).join('') || `<div class="kb-new" data-add="${st}">＋ 新建</div>`}
          </div>
        </div>`;
      }).join('')}
    </div>`;
  let dragged = null;
  wrap.querySelectorAll('.kb-card').forEach(card=>{
    card.addEventListener('dragstart',e=>{ dragged=card.dataset.note; card.classList.add('dragging'); e.dataTransfer.effectAllowed='move'; });
    card.addEventListener('dragend',()=>{ card.classList.remove('dragging'); });
    card.addEventListener('click',()=>{ state.noteId=card.dataset.note; state.view='note'; render(); });
  });
  wrap.querySelectorAll('.kb-col').forEach(col=>{
    col.addEventListener('dragover',e=>{ e.preventDefault(); col.classList.add('over'); });
    col.addEventListener('dragleave',()=>col.classList.remove('over'));
    col.addEventListener('drop',e=>{
      e.preventDefault(); col.classList.remove('over');
      const n = byId(dragged); if(!n || n.status===col.dataset.st) return;
      const toDone = col.dataset.st==='Done';
      setStatus(n, col.dataset.st);
      if(toDone){
        requestAnimationFrame(()=>{
          const c = wrap.querySelector(`.kb-card[data-note="${n.id}"] .seal`);
          if(c) c.classList.add('anim');
        });
      }
    });
  });
  wrap.querySelectorAll('[data-add]').forEach(b=>b.addEventListener('click',()=>{
    const t = prompt('新任务标题：',''); if(!t) return;
    const id=uid();
    NOTES.push({id, file:'task-'+id+'.md', folder:'', title:t, status:b.dataset.add, priority:'Normal', due:'', created:'今天', inbox:false, body:''});
    render();
  }));
  return wrap;
}

/* ---------- 今日到期 / 本周完成 ---------- */
function renderViewList(){
  const el = document.createElement('section'); el.className='view-generic';
  if(state.viewId==='due'){
    const open = NOTES.filter(n=>n.status && n.due && n.due<=TODAY && !['Done','Wont'].includes(n.status)).sort((a,b)=>a.due<b.due?-1:1);
    const over = open.filter(n=>n.due<TODAY), today = open.filter(n=>n.due===TODAY);
    const row = n=>`<div class="due-row" data-note="${n.id}">
      <span class="sdot" style="width:7px;height:7px;border-radius:50%;background:${ST_COLOR[n.status]};flex:none"></span>
      <span class="t">${esc(n.title)}</span>
      ${n.folder?`<span class="fold">${esc(n.folder)}/</span>`:''}
      ${taskChips(n)}</div>`;
    el.innerHTML = `<div class="vg-wrap">
      <div class="vg-head"><h2>今日到期</h2><span class="n">${open.length} 个未关闭</span></div>
      <div class="vg-sub">视图：status 存在 且 due ≤ today 且 status ∉ [Done, Wont] — 保存于 views/due.yml</div>
      ${over.length?`<div class="vg-group-title">已逾期</div>${over.map(row).join('')}`:''}
      <div class="vg-group-title">今天</div>
      ${today.length?today.map(row).join(''):'<div class="rr-empty" style="padding:8px 4px">今天没有到期的任务。</div>'}
    </div>`;
  } else {
    const done = NOTES.filter(n=>n.status && n.done && WEEK.includes(n.done)).sort((a,b)=>a.done<b.done?1:-1);
    const row = n=>`<div class="due-row" data-note="${n.id}">
      <span class="seal" style="position:static;transform:none;width:18px;height:18px;font-size:10.5px;flex:none">讫</span>
      <span class="t">${esc(n.title)}</span>
      ${n.folder?`<span class="fold">${esc(n.folder)}/</span>`:''}
      <span class="chip">${n.done}</span></div>`;
    el.innerHTML = `<div class="vg-wrap">
      <div class="vg-head"><h2>本周完成</h2><span class="n">${done.length} 个 · 10-12 → 10-18</span></div>
      <div class="vg-sub">视图：done ∈ 本周 — 周报素材就在这里。</div>
      ${done.length?done.map(row).join(''):'<div class="rr-empty" style="padding:8px 4px">本周还没有完成的任务。</div>'}
    </div>`;
  }
  el.querySelectorAll('[data-note]').forEach(b=>b.addEventListener('click',()=>{ state.noteId=b.dataset.note; state.view='note'; render(); }));
  return el;
}

/* ---------- Daily 主视图 ---------- */
function renderDaily(){
  let n = NOTES.find(x=>x.date===TODAY && !x.status);
  if(!n){
    n = {id:uid(), file:TODAY+'.md', folder:'', title:TODAY+' · 周三', date:TODAY, created:'刚刚', body:`## 今日聚焦\n- [ ] \n\n## 记录\n`};
    NOTES.push(n);
  }
  state.noteId = n.id;
  return renderEditor();
}

/* ---------- 主渲染 ---------- */
function render(){
  renderSidebar();
  const main = $('#main');
  main.innerHTML='';
  if(state.view==='daily'){ main.appendChild(renderDaily()); $('#stView').textContent='视图 · 今天'; }
  else if(state.view==='kanban'){ main.appendChild(renderKanban()); $('#stView').textContent='视图 · 看板'; }
  else if(state.view==='viewlist'){ main.appendChild(renderViewList()); $('#stView').textContent='视图 · '+(state.viewId==='due'?'今日到期':'本周完成'); }
  else { const n=currentNote(); if(n){ main.appendChild(renderEditor()); $('#stView').textContent='笔记 · '+(n.folder||'根目录'); } else main.appendChild(emptyEditor()); }
  const open = NOTES.filter(n=>n.status&&!['Done','Wont'].includes(n.status)).length;
  $('#stCount').textContent = `${NOTES.length} 篇笔记 · ${open} 个未关闭任务`;
}
function emptyEditor(){
  const el=document.createElement('section'); el.className='editor-wrap';
  el.innerHTML=`<div style="margin:auto;text-align:center;color:var(--ink-3)">
    <div style="font-family:var(--f-dis);font-size:44px;opacity:.25">墨</div>
    <p style="margin-top:10px;font-size:13px">从左侧文件树选择一篇笔记，或 <button style="color:var(--accent);text-decoration:underline" id="emptyCap">快速捕获</button></p></div>`;
  el.querySelector('#emptyCap').addEventListener('click',openCapture);
  return el;
}

/* ---------- 菜单 ---------- */
function menuAt(e, items){
  closeMenu();
  const m = document.createElement('div'); m.className='menu';
  m.innerHTML = items.map((it,i)=>`<button data-i="${i}"><span class="cdot" style="background:${it.color||'var(--ink-3)'}"></span>${esc(it.label)}</button>`).join('');
  document.body.appendChild(m);
  const r = e.currentTarget.getBoundingClientRect();
  m.style.left = Math.min(r.left, innerWidth-180)+'px';
  m.style.top = (r.bottom+6)+'px';
  m.querySelectorAll('button').forEach(b=>b.addEventListener('click',()=>{ items[+b.dataset.i].go(); closeMenu(); }));
  setTimeout(()=>document.addEventListener('click',closeMenu,{once:true}),0);
}
function closeMenu(){ document.querySelectorAll('.menu').forEach(m=>m.remove()); }

/* ---------- 捕获 ---------- */
function openCapture(){
  const ov=$('#overlay'); ov.innerHTML=`
    <div class="modal-cap" role="dialog" aria-label="快速捕获">
      <div class="cap-input"><span class="inkpin"></span>
        <input id="capInput" placeholder="一句话记下…（回车存为待办便签）" autocomplete="off">
      </div>
      <div class="cap-foot">
        <span class="h">保存到 <b>根目录</b> · 之后整理</span>
        <div class="btns"><button id="capNote">存为普通笔记</button><button class="pri" id="capIssue">存为便签 ⏎</button></div>
      </div>
    </div>`;
  ov.classList.add('show');
  const input=$('#capInput'); setTimeout(()=>input.focus(),30);
  const submit=(asTask)=>{
    const t=input.value.trim(); if(!t) return;
    const id=uid();
    NOTES.unshift({id, file:'cap-'+id+'.md', folder:'', title:t,
      status: asTask?'Todo':null, priority: asTask?'Normal':null, due: asTask?'':null,
      created:'刚刚', body:''});
    closeModal();
    toast(asTask?'便签已保存：出现在看板待办列':'笔记已保存到根目录','var(--accent)');
    render();
  };
  input.addEventListener('keydown',e=>{ if(e.key==='Enter') submit(true); if(e.key==='Escape') closeModal(); });
  $('#capIssue').addEventListener('click',()=>submit(true));
  $('#capNote').addEventListener('click',()=>submit(false));
  ov.addEventListener('click',e=>{ if(e.target===ov) closeModal(); });
}
function closeModal(){ const ov=$('#overlay'); ov.classList.remove('show'); ov.innerHTML=''; }

/* ---------- 快速打开 ---------- */
let qoSel=0;
function openQuickOpen(){
  const ov=$('#overlay'); ov.innerHTML=`
    <div class="modal-qo" role="dialog" aria-label="快速打开">
      <div class="qo-input">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="7" cy="7" r="4.5"/><path d="m10.5 10.5 3.5 3.5"/></svg>
        <input id="qoInput" placeholder="按标题或文件名模糊跳转…" autocomplete="off">
      </div>
      <div class="qo-list" id="qoList"></div>
    </div>`;
  ov.classList.add('show');
  const input=$('#qoInput'), list=$('#qoList');
  const all=[...NOTES];
  function draw(){
    const q=input.value.trim().toLowerCase();
    const hits = q? all.filter(n=>(n.title+n.file).toLowerCase().includes(q)) : all.slice(0,10);
    qoSel=Math.min(qoSel,Math.max(0,hits.length-1));
    list.innerHTML = hits.length? hits.map((n,i)=>`
      <button class="qo-item ${i===qoSel?'sel':''}" data-note="${n.id}">
        <span class="fi">${I.file}</span>${esc(n.title)}
        ${n.status?`<span class="chip st-${n.status}">${ST_LABEL[n.status]}</span>`:''}
        <span class="path">${esc((n.folder?n.folder+'/':'')+n.file)}</span>
      </button>`).join('') : '<div class="qo-empty">没有匹配。回车将创建新笔记。</div>';
    list.querySelectorAll('[data-note]').forEach(b=>b.addEventListener('click',()=>{ go(b.dataset.note); }));
    return hits;
  }
  let hits=draw();
  function go(id){ closeModal(); state.noteId=id; state.view='note'; render(); }
  input.addEventListener('input',()=>{ qoSel=0; hits=draw(); });
  input.addEventListener('keydown',e=>{
    if(e.key==='ArrowDown'){ qoSel++; hits=draw(); e.preventDefault(); }
    else if(e.key==='ArrowUp'){ qoSel=Math.max(0,qoSel-1); hits=draw(); e.preventDefault(); }
    else if(e.key==='Enter'){
      if(hits[qoSel]) go(hits[qoSel].id);
      else if(input.value.trim()){ gotoTitle(input.value.trim()); closeModal(); }
    }
    else if(e.key==='Escape') closeModal();
  });
  setTimeout(()=>input.focus(),30);
  ov.addEventListener('click',e=>{ if(e.target===ov) closeModal(); });
}

/* ---------- 全局事件 ---------- */
$('#btnCaptureTop').addEventListener('click',openCapture);
$('#btnQuickOpen').addEventListener('click',openQuickOpen);
$('#btnTheme').addEventListener('click',()=>{
  const h=document.documentElement;
  h.dataset.theme = h.dataset.theme==='light'?'dark':'light';
  toast(h.dataset.theme==='dark'?'夜墨主题':'昼白主题','var(--accent)');
});
document.querySelectorAll('.winctl button').forEach((b,i)=>b.addEventListener('click',()=>{
  toast(i===2?'这是原型，先不关 :)':'窗口控制（原型占位）','var(--ink-3)');
}));
document.addEventListener('keydown',e=>{
  const mod = e.ctrlKey||e.metaKey;
  if(mod && e.key.toLowerCase()==='n'){ e.preventDefault(); openCapture(); }
  else if(mod && e.key.toLowerCase()==='p'){ e.preventDefault(); openQuickOpen(); }
  else if(mod && e.key==='\\'){ e.preventDefault(); if(currentNote()){ state.sourceMode=!state.sourceMode; render(); } }
  else if(e.key==='Escape'){ closeModal(); closeMenu(); }
});

/* ---------- 启动：默认打开一篇笔记（笔记查看为主） ---------- */
state.noteId = NOTES.find(n=>n.title==='设计方案笔记').id;
render();
setTimeout(()=>toast('PKMX · Ctrl+N 捕获 / Ctrl+P 跳转','var(--accent)'), 700);
</script>
</body>
